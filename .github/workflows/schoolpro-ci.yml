name: SchoolPro Full Verification

on:
  push:
    branches: [main, 'schoolpro-*']
  pull_request:
    branches: [main, 'schoolpro-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolPro-Android-Debug-Verification
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/SchoolPro-Admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolPro-Admin-Web
          path: build/web
          if-no-files-found: error
          retention-days: 7

  firebase-rules-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm ci --prefix functions
      - run: cmp firestore.rules admin/SchoolPro-Admin/firestore.rules
      - run: node --check functions/index.js
      - run: node --check functions/notice_notifications.js
      - run: node --check tests/rules.test.js
      - run: node --check tests/functions.test.js
      - run: node -e "JSON.parse(require('fs').readFileSync('firebase.json')); JSON.parse(require('fs').readFileSync('firestore.indexes.json'))"
      - run: npx --yes firebase-tools emulators:exec --project schoolpro-rules-test --only firestore,storage "npm --prefix tests test"
